name: Build Android APK from archive



on:

  workflow_dispatch:
  
  push:
  
    branches: [ "main" ]
    


jobs:

  build:
  
    runs-on: ubuntu-latest
    
    permissions:
    
      contents: read
      
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Unpack source
      
        run: unzip -q alf-non-native-project.zip
        
      - name: Set up JDK 17
      
        uses: actions/setup-java@v5
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
          cache: gradle
          
      - name: Accept Android licenses
      
        run: yes | sdkmanager --licenses > /dev/null || true
        
      - name: Install Android SDK packages
      
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        
      - name: Build debug APK
      
        working-directory: alf-non-native
        
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
        
      - name: Upload APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: alf-non-debug-apk
          
          path: alf-non-native/app/build/outputs/apk/debug/app-debug.apk
          
          if-no-files-found: error
          
          retention-days: 14






























